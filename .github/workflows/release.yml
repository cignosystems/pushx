name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege: publishing needs the HEX_API_KEY secret, not repo write.
permissions:
  contents: read

env:
  # See ci.yml: silences OTP 29 `catch Expr` deprecation warnings from the
  # yamerl Erlang dep (dev/test only). Remove when yamerl ships a fix.
  ERL_COMPILER_OPTIONS: "[nowarn_deprecated_catch]"

jobs:
  # Never publish untested code: the tag must match mix.exs and the full
  # suite (with the coverage gate) must pass on the release toolchain.
  verify:
    name: Verify tag and run tests
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Check tag matches mix.exs version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -E '^\s*@version "' mix.exs | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG mix.exs=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag v$TAG does not match mix.exs @version $VERSION"; exit 1; }

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests with coverage threshold
        run: mix test --cover

  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    needs: verify
    env:
      MIX_ENV: dev  # Required for ex_doc to be available

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Clean build
        run: mix deps.compile --force

      - name: Publish package to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Publish docs to HexDocs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes

  # The GitHub Release is the human-facing counterpart of the Hex release:
  # notes are the version's CHANGELOG section, attached to the same tag.
  github_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/release_notes.sh "$VERSION" > /tmp/notes.md
          test -s /tmp/notes.md || { echo "::error::no CHANGELOG section for $VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md
