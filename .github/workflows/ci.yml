name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so newly published dependency advisories fail CI even when
  # nothing has been pushed (mix_audit checks the advisory DB at run time).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"

jobs:
  # Quality checks - only run once, not for every matrix combination
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v6
        id: cache-deps
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      # mix_audit instead of hex.audit so unfixable advisories can be pinned.
      # The two ignored IDs are cowlib 2.19.0 advisories (test-only dep, via
      # Bypass) with no fixed cowlib release published; the response-splitting
      # one is mitigated downstream by cowboy >= 2.16 (we lock 2.18). Remove
      # the ignores when a fixed cowlib ships.
      - name: Check for security vulnerabilities
        run: mix deps.audit --ignore-advisory-ids GHSA-w4f7-4cxr-rv3c,GHSA-g2wm-735q-3f56

      - name: Run Credo
        run: mix credo --strict

      # Catches packaging mistakes (files list, metadata, missing licence)
      # before a release rather than at `mix hex.publish` time.
      - name: Check the Hex package builds
        run: mix hex.build

  # Run tests across multiple Elixir/OTP versions
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    needs: quality  # Only run tests if quality checks pass

    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest versions
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.19"
            otp: "27"
          # Minimum supported versions
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.18"
            otp: "26"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run tests
        run: mix test

  # Coverage gate: `mix test --cover` fails below the threshold configured in
  # mix.exs (`test_coverage: [summary: [threshold: ...]]`). Runs once on the
  # primary toolchain — line coverage does not vary across the matrix.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests with coverage threshold
        run: mix test --cover

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: cover/
          retention-days: 14

  # Dialyzer static analysis — PLT is cached separately because building it
  # takes minutes while the analysis itself takes seconds.
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    needs: quality
    env:
      MIX_ENV: dev # dialyxir is a :dev dependency

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dialyzer-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dialyzer-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache PLT
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer --format github

  # Build documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: quality
    env:
      MIX_ENV: dev  # ex_doc is only available in :dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Build docs
        run: mix docs --warnings-as-errors
